name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Build host library
        run: make
      - name: Check exported ABI
        run: nm -gU libswift_studio.dylib | grep -q _studio_step
